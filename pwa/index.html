<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f9f9f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Asistente para organizar tu día: agenda, tareas, alarmas y momentos para concentrarte." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Agente TDAH</title>
    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #f9f9f6;
      }
      @media (prefers-color-scheme: dark) {
        html, body, #root { background-color: #121214; }
      }
      #root {
        display: flex;
        flex-direction: column;
      }
      /* Foco visible del teclado (COGA: saber siempre donde estas). Anillo
         doble: se ve sobre claro y oscuro. Solo con teclado, no al tocar. */
      :focus-visible {
        outline: 3px solid #2547c9;
        outline-offset: 2px;
        box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.9);
        border-radius: 4px;
      }
      @media (prefers-color-scheme: dark) {
        :focus-visible { outline-color: #8fb0ff; box-shadow: 0 0 0 5px rgba(18, 18, 20, 0.9); }
      }
      ::selection { background: rgba(255, 225, 77, 0.55); }
      /* Decision 10: si el sistema pide "reducir movimiento", nada se anima. */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
